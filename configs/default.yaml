experiment:
  aligners:
    - pca
    - kpca
    - coral
    - ot
  seeds:
    - 64
    - 63
    - 62
    - 61
    - 60
  search: []
  search_samples: 2000
  selection_metric: recall
  include_raw_baseline: true
  extract_embeddings: false
  tokenizer: bert-base-multilingual-cased

kpca:
  selected:
    gamma: 0.02
    n_fit: 15000
    alpha: 0.01
    n_components: 32
    k_align: 32

  search:
    gamma:
      - 0.00002
      - 0.0002
      - 0.002
      - 0.02
      - 0.2
      - 2.0
      - 5.0
      - 10.0
    n_fit:
      - 5000
      - 10000
      - 15000
    alpha:
      - 0.01
      - 0.05
      - 0.1
    n_components:
      - 32
      - 64
      - 128
      - 256
    k_align:
      - 32
      - 64
      - 128

ot:
  selected:
    reg: 20.0
    standardize: true
    metric: sqeuclidean
    num_iter_max: 150
    tol: 0.0001

  search:
    reg:
      - 20.0
      - 30.0
      - 50.0
      - 80.0
      - 100.0
    standardize:
      - true
      - false

example:
  seed: 60
  source_type: case_error
  target_type: verb
  embeddings_dir: example/embeddings/finetuned_on_mbert_case_error
  source_folder: case_error_cls_test
  target_folder: verb_cls_test
